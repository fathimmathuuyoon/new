<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JavaScript</h1>
    <script>
        function calc(num1,num2,operator){
            if(operator === "+"){
                return num1+num2
            }
            else if(operator === "-"){
                return num1-num2
            }
            else if(operator === "*"){
                return num1*num2
            }
            else if(operator === "/"){
                return num1/num2
            }
            else {
                return "invalid"
            }
        }
        console.log(calc(4,2, "/"))
    </script>
</body>
</html>
